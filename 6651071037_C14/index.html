<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Câu 14</title>
    <script src="../jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="panel">
      <h2>Giao diện sáng / tối</h2>
      <p class="description">Bật công tắc để chuyển sang giao diện sáng, tắt để trở về giao diện tối.</p>
      <div class="toggle-row">
        <div class="label">Theme</div>
        <div id="themeToggle" class="switch" role="switch" aria-checked="false" tabindex="0" aria-label="Toggle theme"><div class="slider"></div></div>
      </div>
      <div class="status" id="themeStatus">Status: Off</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
